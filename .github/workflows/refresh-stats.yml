name: refresh stats

# Regenerates assets/langs.svg from the GitHub API so the language chart stays
# current without depending on a third-party card service.
on:
  schedule:
    - cron: '23 5 * * 1'   # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the language chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/gen-langs.sh
          scripts/gen-langs.sh

      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/langs.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name  "EsmeAbha"
          git config user.email "100505484+EsmeAbha@users.noreply.github.com"
          git add assets/langs.svg
          git commit -m "chore: refresh language chart"
          git push
