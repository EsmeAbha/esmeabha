<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="abha - backend engineer, AI tooling, automation">
  <title>abha — backend engineer · ai tooling · automation</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0b14"/>
      <stop offset="55%" stop-color="#050509"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="1.55" fill="#ffffff"/>
    </pattern>

    <!-- dot fields dissolve toward the centre -->
    <radialGradient id="fadeL" cx="8%" cy="50%" r="46%">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fadeR" cx="92%" cy="52%" r="46%">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="mL"><rect width="1280" height="340" fill="url(#fadeL)"/></mask>
    <mask id="mR"><rect width="1280" height="340" fill="url(#fadeR)"/></mask>

    <!-- a band of light that travels across the dots -->
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="sweep">
      <rect x="-520" y="0" width="520" height="340" fill="url(#sweepGrad)">
        <animate attributeName="x" values="-520;1280" dur="6.5s" repeatCount="indefinite"/>
      </rect>
    </mask>

    <linearGradient id="tintL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CECBF6"/>
      <stop offset="100%" stop-color="#7F77DD"/>
    </linearGradient>
    <linearGradient id="tintR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#F0C9B8"/>
      <stop offset="100%" stop-color="#D4537E"/>
    </linearGradient>

    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E7BFF">
        <animate attributeName="stop-color" values="#8E7BFF;#D4537E;#8E7BFF" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#D4537E">
        <animate attributeName="stop-color" values="#D4537E;#8E7BFF;#D4537E" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#9B8CFF" stop-opacity="0.85"/>
      <stop offset="45%"  stop-color="#7F77DD" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7F77DD" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- typewriter reveal for the tagline -->
    <clipPath id="type">
      <rect x="386" y="274" width="0" height="22">
        <animate attributeName="width" values="0;516" dur="2.4s" begin="0.9s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>

  <!-- LEFT field: drifts inward, base layer plus a swept highlight -->
  <g mask="url(#mL)">
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 12 0; 0 0" dur="11s" repeatCount="indefinite"/>
      <rect width="1280" height="340" fill="url(#dots)" opacity="0.42"/>
      <rect width="640" height="340" fill="url(#tintL)" opacity="0.16"/>
      <g mask="url(#sweep)">
        <rect width="1280" height="340" fill="url(#dots)" opacity="0.85"/>
      </g>
    </g>
  </g>

  <!-- RIGHT field -->
  <g mask="url(#mR)">
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; -12 0; 0 0" dur="11s" repeatCount="indefinite"/>
      <rect width="1280" height="340" fill="url(#dots)" opacity="0.38"/>
      <rect x="640" width="640" height="340" fill="url(#tintR)" opacity="0.18"/>
      <g mask="url(#sweep)">
        <rect width="1280" height="340" fill="url(#dots)" opacity="0.8"/>
      </g>
    </g>
  </g>

  <!-- the core -->
  <g transform="translate(640 158)">
    <circle r="132" fill="url(#halo)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="126;138;126" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- orbiting particles -->
    <circle r="3" fill="#D4537E" opacity="0.9">
      <animateMotion dur="9s" repeatCount="indefinite"
                     path="M0,-98 A98,98 0 1,1 0,98 A98,98 0 1,1 0,-98"/>
    </circle>
    <circle r="2.2" fill="#CECBF6" opacity="0.8">
      <animateMotion dur="9s" begin="-3s" repeatCount="indefinite"
                     path="M0,-98 A98,98 0 1,1 0,98 A98,98 0 1,1 0,-98"/>
    </circle>
    <circle r="2.6" fill="#8E7BFF" opacity="0.85">
      <animateMotion dur="9s" begin="-6s" repeatCount="indefinite"
                     path="M0,-98 A98,98 0 1,1 0,98 A98,98 0 1,1 0,-98"/>
    </circle>

    <!-- rotating diamond, glow behind it -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="26s" repeatCount="indefinite"/>
      <g filter="url(#soft)" opacity="0.85">
        <path d="M0,-46 L26,0 L0,46 L-26,0 Z" fill="url(#core)"/>
      </g>
      <path d="M0,-40 L23,0 L0,40 L-23,0 Z" fill="url(#core)"/>
      <path d="M0,-40 L23,0 L0,40 L-23,0 Z" fill="none" stroke="#CECBF6" stroke-width="1" opacity="0.55"/>
    </g>

    <circle r="4" fill="#ffffff">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark: fades up as the letter-spacing tightens -->
  <text x="640" y="250" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="60" font-weight="300" fill="#ffffff"
        letter-spacing="34" opacity="0">
    abha
    <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.15s" fill="freeze"/>
    <animate attributeName="letter-spacing" values="34;14" dur="1.6s" begin="0.15s" fill="freeze"
             calcMode="spline" keyTimes="0;1" keySplines="0.16 0.9 0.2 1"/>
  </text>

  <!-- tagline types itself out, with a cursor that follows -->
  <g clip-path="url(#type)">
    <text x="640" y="290" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" letter-spacing="4.5" fill="#8F8AB8">backend engineer · ai tooling · automation</text>
  </g>
  <rect y="278" width="7" height="14" fill="#D4537E" x="386">
    <animate attributeName="x" values="386;902" dur="2.4s" begin="0.9s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- hairline draws itself in -->
  <rect x="640" y="312" width="0" height="1" fill="url(#core)" opacity="0.55">
    <animate attributeName="x" values="640;440" dur="1.2s" begin="1.1s" fill="freeze"/>
    <animate attributeName="width" values="0;400" dur="1.2s" begin="1.1s" fill="freeze"/>
  </rect>
</svg>
